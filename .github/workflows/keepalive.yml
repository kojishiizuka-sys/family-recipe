name: Supabase keep-alive

on:
  schedule:
    - cron: "17 0 * * 1,4"   # 毎週 月・木 9:17（日本時間）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/synonyms?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}")
          echo "HTTP $code"
          test "$code" = "200"
